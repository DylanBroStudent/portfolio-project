<!DOCTYPE html>
<html lang="en">
<head>
    <!-- js -->
    <script type="module" src="/components/firebase/firebase-config.js"></script>
    <script type="module" src="/components/projects/projects.js"></script>
    <script type="module" src="/components/footer/footer.js"></script>
    <script type="module" src="/components/header/header.js"></script>
    <!-- css -->
    <link rel="stylesheet" href="/assets/global-styles/global.css">
    <link rel="stylesheet" href="/components/contact/contact.css">
    <!-- misc -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dylan Brodie's Portfolio | Contact</title>
    <meta name="description" content="Get in contact with Dylan Brodie">
    <meta name="keywords" content="contact Dylan Brodie, hire, collaboration, contact information, email, social media">
    <meta name="author" content="Dylan Brodie">
</head>
<body>
    
    <!-- Header -->
    <header class="main-header" id="header-placeholder"></header>

    <!-- Main Content-->
    <main>
        <section class="content-space">
        </section>
        <section class="contact-social-links">
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 1">
                </a>
            </div>
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 2">
                </a>
            </div>
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 3">
                </a>
            </div>
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 4">
                </a>
            </div>
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 5">
                </a>
            </div>
            <div class="contact-link-tile">
                <a href="">
                    <img src="../assets/images/site/placeholder_goldenwide.svg"alt="Thumbnail for social media link 6">
                </a>
            </div>
        </section>
        <section id="Contact" class="content-section">
            <div class="text-content">
                <h1>Contact</h1>
                <p>
                    <a href="mailto:dylan-brodie@live.nmit.ac.nz">dylan-brodie@live.nmit.ac.nz</a>
                </p>
            </div>
        </section>
        <section class="content-section">
            <form method="" class="contact-form">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="full-name">Name/Organisation (required):</label>
                    <input type="text" id="full-name" name="name" placeholder="Ex. John Doe" required size="20">
        
                    <label for="email">Email address (required):</label>
                    <input placeholder="example@email.com" required id="email" type="email" name="email" size="20" />
                </fieldset>

                <fieldset>
                    <legend>
                        What is your the nature of your inquiry?
                    </legend>
        
                    <label for="Business">| Business</label>
                    <input type="checkbox" id="Business" name="Business" value="Business" />
        
                    <label for="Collaboration">| Collaboration</label>
                    <input type="checkbox" id="Collaboration" name="Collaboration" value="Collaboration" />
        
                    <label for="Fan Mail">| Fan Mail</label>
                    <input type="checkbox" id="Fan Mail" name="Fan Mail" value="Fan Mail" />
        
                    <label for="Hate Mail">| Hate Mail</label>
                    <input checked type="checkbox" id="Hate Mail" name="Hate Mail" value="Hate Mail" />
        
                    <label for="Fashion Tips">| Fashion Advice </label>
                    <input type="checkbox" id="Fashion Tips" name="Fashion Tips" value="Fashion Tips" />
                    |
                </fieldset>
                <fieldset>
                    <legend>
                        Message
                    </legend>
                    <textarea name="Message" id="Message"></textarea>
                    <input type="submit" class="contact-form-submit-button">
                </fieldset>

        
            </form>
        </section>
    </main>
    <!-- Footer -->
    <footer class="footer" id="footer-placeholder"></footer>

</body>
</html>
